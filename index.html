<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layover</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161617">
<meta name="description" content="An offline word and puzzle arcade for long flights.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Layover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <main id="home"></main>
  <main id="screen" hidden>
    <header>
      <button class="icon-btn" id="backBtn" aria-label="Back to all games">‹</button>
      <h1 id="title"></h1>
      <div class="head-right">
        <button class="icon-btn small" id="clueBtn" aria-label="Get a clue letter" hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M9 21h6v1.5H9zM12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z"/></svg></button>
        <button class="icon-btn small fav" id="favBtn" aria-label="Bookmark this game"></button>
        <button class="icon-btn small" id="helpBtn" aria-label="How to play">?</button>
        <button class="icon-btn small" id="statsBtn" aria-label="Statistics">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 13h4v7H4zM10 4h4v16h-4zM16 9h4v11h-4z"/></svg>
        </button>
      </div>
    </header>
    <div id="view"></div>
    <div class="result" id="result" hidden>
      <p class="result-title" id="resultTitle"></p>
      <p class="result-word" id="resultWord"></p>
      <button class="primary" id="nextBtn">Play again</button>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<dialog id="helpDlg">
  <h2 id="helpTitle"></h2>
  <div id="helpBody"></div>
  <form method="dialog"><button class="primary">Got it</button></form>
</dialog>

<dialog id="statsDlg">
  <h2 id="statsTitle"></h2>
  <div class="stat-row" id="statRow"></div>
  <div class="dist" id="dist"></div>
  <form method="dialog"><button class="primary">Close</button></form>
</dialog>

<script src="words.js"></script>
<script src="world.js"></script>
<script src="core.js"></script>
<script src="modes-guess.js"></script>
<script src="modes-word.js"></script>
<script src="modes-logic.js"></script>
<script src="modes-fun.js"></script>
<script src="geo.js"></script>
<script src="chess-data.js"></script>
<script src="chess.js"></script>
<script src="modes-chess.js"></script>
<script src="modes-globe.js"></script>
<script src="boot.js"></script>
</body>
</html>
